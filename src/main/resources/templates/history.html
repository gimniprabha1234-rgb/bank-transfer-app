
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Transaction History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #12345a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #12345a;
            color: white;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            background: #12345a;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty {
            padding: 20px;
            background: #eaf1fa;
            border-radius: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
                overflow-x: auto;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Account Transaction History</h1>

    <h3>
        Account Number:
        <span th:text="${selectedAccount}"></span>
    </h3>

    <table>
        <thead>
        <tr>
            <th>Transaction ID</th>
            <th>From Account</th>
            <th>To Account</th>
            <th>Amount (Rs.)</th>
            <th>Description</th>
            <th>Status</th>
            <th>Date</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="transaction : ${history}">

            <td th:text="${transaction.id}"></td>

            <td th:text="${transaction.fromAccount}"></td>

            <td th:text="${transaction.toAccount}"></td>

            <td th:text="${transaction.amount}"></td>

            <td th:text="${transaction.description}"></td>

            <td th:text="${transaction.status}"></td>

            <td th:text="${transaction.createdAt}"></td>

        </tr>

        <tr th:if="${#lists.isEmpty(history)}">
            <td colspan="7">No transaction history found.</td>
        </tr>

        </tbody>
    </table>

    <a th:href="@{/}" class="back">Back to Dashboard</a>

</div>

</body>
</html>
